name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Jest & visual checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # TASK-81 (KURA_BACKLOG_FIX_7), rodada de fix 1 — G2 apontou que a metade 2
      # de src/__tests__/smoke-coverage.test.ts (checar que todo "coberto: <nome>"
      # do registry existe de fato em DevOps-Cloud/scripts/smoke-contratos.sh) só
      # rodava quando os 2 repos eram irmãos no filesystem, o que não é verdade no
      # checkout de CI padrão (só este repo). DevOps-Cloud é público
      # (KURA-Clyvo/DevOps-Cloud) — este segundo checkout lê o HEAD real do script
      # a cada run, sem vendorizar cópia (que criaria fonte dupla e apodreceria,
      # exatamente o padrão que este projeto já reprovou em outro lugar). Fica em
      # $GITHUB_WORKSPACE/DevOps-Cloud — smoke-coverage.test.ts já sabe achar esse
      # caminho (3º candidato de `candidatosDevOpsCloud`).
      - name: Checkout DevOps-Cloud (fonte real do smoke-contratos.sh)
        uses: actions/checkout@v4
        with:
          repository: KURA-Clyvo/DevOps-Cloud
          path: DevOps-Cloud

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # O cache de transform do Jest era frio em TODA execucao (o `cache: npm` acima
      # cobre so o registry, nao isto). Medido: com ele frio, o PRIMEIRO render React
      # Native de um worker custa ~7.2 s sozinho — foi o que empurrava o teste 1 de
      # PerfilScreen.test.tsx contra o timeout, e o que faz cada arquivo de teste levar
      # 20-30 s de wall clock aqui. A chave inclui o lockfile porque uma troca de
      # dependencia invalida o resultado da transformacao.
      - name: Cache do transform do Jest
        uses: actions/cache@v4
        with:
          path: .jest-cache
          key: jest-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            jest-cache-${{ runner.os }}-

      # `test:coverage` em vez de `test`: o `coverageThreshold` do package.json so e
      # avaliado quando o Jest roda COM --coverage. Rodando `npm test` aqui, o piso de
      # cobertura existia no config e nunca era verificado por ninguem — exatamente o
      # tipo de promessa nao-executavel que o README ja fazia ("≥ 60%", sem limiar
      # configurado). `test:coverage` nao tem --watchAll, entao nao precisa override.
      - name: Test (com piso de cobertura)
        run: npm run test:coverage

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      # Enforce a paleta do app tutor (--sage) — nenhuma cor hex hardcoded fora
      # dos tokens de design, e nenhum token --ocean (contexto clínica) pode
      # vazar para a experiência do tutor.
      - name: Check hardcoded colors
        run: npm run check:colors

      - name: Check no ocean tokens in tutor app
        run: npm run check:no-ocean
